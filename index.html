<style>
:root{
  --bg:#242226;
  --bg-soft:#2b292d;
  --surface:#343237;
  --surface-2:#3e3b41;
  --line:#4b484d;
  --maroon:#7c2438;
  --maroon-light:#a3324a;
  --maroon-dark:#54182a;
  --cream:#f1ebe5;
  --muted:#a79f9c;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--cream);
  font-family:'Vazirmatn', sans-serif;
  min-height:100vh;
  line-height:1.8;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
img{max-width:100%;display:block;}
::selection{background:var(--maroon);color:#fff;}

/* Decorative divider */
.divider{
  width:100%;height:18px;
  background-image: radial-gradient(circle at 50% -6px, transparent 9px, var(--maroon) 10px, transparent 11px);
  background-size:26px 20px;
  background-repeat:repeat-x;
  opacity:.55;
  margin: 6px 0;
}

/* ---------- Top nav ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(36,34,38,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo-mark{width:40px;height:40px;flex:none;}
.brand .name-fa{font-weight:800;font-size:19px;letter-spacing:.5px;}
.brand .name-en{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:-3px;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-links a{
  font-size:14px;color:var(--muted);padding:8px 12px;border-radius:8px;
  transition:.2s;
}
.nav-links a.active,.nav-links a:hover{color:var(--cream);background:var(--surface);}

/* cart button */
.cart-btn{
  position:relative;display:flex;align-items:center;gap:6px;
  background:var(--maroon);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);
}
.cart-btn .badge{
  background:#fff;color:var(--maroon-dark);font-size:11px;font-weight:800;
  border-radius:99px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ---------- Layout ---------- */
#app{max-width:1100px;margin:0 auto;padding:0 18px 90px;}
.section{padding:38px 0 10px;}
.eyebrow{color:var(--maroon-light);font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:8px;}
h1,h2,h3{margin:0 0 8px;font-weight:800;}
.muted{color:var(--muted);}

/* ---------- Hero ---------- */
.hero{
  text-align:center;padding:60px 16px 20px;
}
.hero .logo-mark-big{width:96px;height:96px;margin:0 auto 18px;}
.hero h1{font-size:44px;margin-bottom:4px;}
.hero .en{letter-spacing:8px;color:var(--maroon-light);font-size:13px;text-transform:uppercase;font-weight:700;margin-bottom:18px;}
.hero p{max-width:520px;margin:0 auto 26px;color:var(--muted);font-size:15px;}
.btn-primary{
  display:inline-block;background:var(--maroon);color:#fff;padding:13px 30px;border-radius:12px;
  font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:.2s;
}
.btn-primary:hover{background:var(--maroon-light);transform:translateY(-1px);}
.btn-ghost{
  display:inline-block;background:transparent;color:var(--cream);padding:12px 26px;border-radius:12px;
  border:1px solid var(--line);font-weight:600;font-size:14px;
}
.btn-ghost:hover{border-color:var(--maroon-light);}

.video-wrap{
  margin:34px auto 0;max-width:760px;border-radius:18px;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);
  aspect-ratio:16/9;position:relative;
}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.video-fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,var(--maroon-dark),var(--surface-2));
}
.video-fallback svg{width:46px;height:46px;opacity:.85;}
.video-fallback span{color:var(--muted);font-size:14px;}

/* ---------- Category grid ---------- */
.cat-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px;
}
.cat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;
  transition:.2s;position:relative;overflow:hidden;
}
.cat-card:hover{border-color:var(--maroon-light);transform:translateY(-2px);box-shadow:var(--shadow);}
.cat-card .icon{font-size:26px;margin-bottom:10px;display:block;}
.cat-card h3{font-size:16px;margin-bottom:4px;}
.cat-card .count{font-size:12px;color:var(--muted);}
.cat-card::after{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--maroon);
}

/* ---------- Items ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:6px;}
.back-link:hover{color:var(--cream);}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:18px;}
.item-card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:.2s;
}
.item-card:hover{border-color:var(--maroon-light);}
.item-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);}
.item-img.placeholder{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--maroon-light);background:linear-gradient(135deg,var(--surface-2),var(--bg-soft));}
.item-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.item-body h4{font-size:16px;margin:0;}
.item-body .ing{font-size:12.5px;color:var(--muted);min-height:32px;}
.item-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;}
.price{font-weight:800;font-size:14.5px;color:var(--cream);}
.price::after{content:" تومان";font-weight:400;font-size:11px;color:var(--muted);}
.add-btn{
  background:var(--maroon);color:#fff;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;
}
.add-btn:hover{background:var(--maroon-light);}
.empty-note{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;}

/* ---------- Cart drawer ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:.25s;
}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--bg-soft);z-index:61;
  border-left:1px solid var(--line);transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h3{margin:0;font-size:16px;}
.drawer-close{background:var(--surface);width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:16px;}
.drawer-body{flex:1;overflow:auto;padding:14px 18px;}
.drawer-foot{padding:16px 18px;border-top:1px solid var(--line);}
.cart-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);}
.cart-row .info{font-size:13.5px;}
.cart-row .info b{display:block;font-size:14px;}
.cart-row .qty{color:var(--muted);font-size:12px;}
.cart-row .remove{background:transparent;color:var(--maroon-light);font-size:18px;padding:4px 8px;}
.cart-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.9;}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:10px;}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);margin-top:60px;padding:26px 18px;text-align:center;color:var(--muted);font-size:12.5px;}

/* ---------- Admin ---------- */
.admin-shell{max-width:980px;}
.login-box{
  max-width:360px;margin:70px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:34px 26px;text-align:center;box-shadow:var(--shadow);
}
.login-box .logo-mark{width:54px;height:54px;margin:0 auto 14px;}
.field{margin-bottom:14px;text-align:right;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--cream);
  padding:11px 13px;font-family:inherit;font-size:14px;outline:none;transition:.2s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--maroon-light);}
.field textarea{resize:vertical;min-height:70px;}
.error-msg{color:#e07a8d;font-size:13px;margin-top:8px;min-height:16px;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;}
.stat-card .num{font-size:32px;font-weight:800;color:var(--maroon-light);}
.stat-card .lbl{color:var(--muted);font-size:13px;margin-top:4px;}

.admin-tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;}
.admin-tabs a{
  padding:9px 16px;border-radius:10px;font-size:13.5px;border:1px solid var(--line);color:var(--muted);
}
.admin-tabs a.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}

.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

.img-upload{
  border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;
  background:var(--bg);
}
.img-upload img{max-height:120px;margin:0 auto 8px;border-radius:8px;}
.img-upload .hint{font-size:12px;color:var(--muted);}

.manage-cat{margin-top:24px;}
.manage-cat h3{font-size:15px;color:var(--maroon-light);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}
.manage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.manage-item{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;
  transition:.15s;
}
.manage-item:hover{border-color:var(--maroon-light);}
.manage-item .thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex:none;}
.manage-item .thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--maroon-light);}
.manage-item .mi-info{flex:1;min-width:0;}
.manage-item .mi-info b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.manage-item .mi-info span{font-size:11.5px;color:var(--muted);}
.mi-actions{display:flex;flex-direction:column;gap:6px;}
.mi-actions button{background:var(--surface-2);color:var(--cream);border-radius:7px;padding:5px 10px;font-size:11.5px;}
.mi-actions button.del{color:#e07a8d;}
.mi-actions button:hover{background:var(--maroon);color:#fff;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--maroon);color:#fff;
  padding:12px 22px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.small-link{font-size:12px;color:var(--muted);}
.small-link:hover{color:var(--maroon-light);}
.logout-btn{background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 14px;font-size:12.5px;}
.logout-btn:hover{color:var(--cream);}
</style>
</head>
<body>

<div class="topbar">
  <a href="#/" class="brand">
    <span class="logo-mark" id="logoSlotTop"></span>
    <span>
      <span class="name-fa" style="display:block;">صابینا</span>
      <span class="name-en">SABINA CAFE</span>
    </span>
  </a>
  <div class="nav-links" id="navLinks">
    <a href="#/">خانه</a>
    <a href="#/menu">منو</a>
    <a href="#/admin" class="small-link" style="margin-inline-start:6px;">مدیریت</a>
  </div>
  <button class="cart-btn" id="openCartBtn" data-action="open-cart">
    🧾 لیست سفارش <span class="badge" id="cartBadge">0</span>
  </button>
</div>

<div id="app"></div>

<footer>
  © کافه صابینا — Sabina Cafe · این صفحه فقط جهت مشاهده منو است و امکان ثبت سفارش آنلاین ندارد.
</footer>

<!-- Cart drawer -->
<div class="overlay" id="overlay" data-action="close-cart"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>لیست سفارش شما</h3>
    <button class="drawer-close" data-action="close-cart">✕</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Logo (inline SVG, reused as favicon too) ============ */
const LOGO_SVG = `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="47" fill="#343237" stroke="#7c2438" stroke-width="3"/>
  <path d="M30 42h34v16a17 17 0 0 1-17 17 17 17 0 0 1-17-17V42z" fill="none" stroke="#f1ebe5" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M64 46h5a7 7 0 0 1 0 14h-5" fill="none" stroke="#f1ebe5" stroke-width="3.2"/>
  <path d="M36 34c0-3 3-3 3-6s-3-3-3-6" fill="none" stroke="#a3324a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M46 34c0-3 3-3 3-6s-3-3-3-6" fill="none" stroke="#a3324a" stroke-width="2.6" stroke-linecap="round"/>
  <text x="50" y="85" text-anchor="middle" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="800" fill="#a3324a" letter-spacing="2">SABINA</text>
</svg>`;
document.getElementById('logoSlotTop').innerHTML = LOGO_SVG;

/* ============ Data ============ */
const CATS = [
  {slug:'special', name:'نوشیدنی‌های ویژه', icon:'⭐'},
  {slug:'cold',    name:'نوشیدنی‌های سرد',  icon:'🧊'},
  {slug:'hot',     name:'نوشیدنی‌های گرم',  icon:'☕'},
  {slug:'icetea',  name:'ایس‌تی',          icon:'🍹'},
  {slug:'tea',     name:'چای',             icon:'🍵'},
  {slug:'mocktail',name:'ماکتیل',          icon:'🍸'},
  {slug:'shake',   name:'شیک',             icon:'🥤'},
  {slug:'dessert', name:'دسر',             icon:'🍰'},
];
const catName = slug => (CATS.find(c=>c.slug===slug)||{}).name || slug;

const DB = {
  items(){ try{return JSON.parse(localStorage.getItem('sabina_items')||'[]')}catch(e){return []} },
  saveItems(v){ localStorage.setItem('sabina_items', JSON.stringify(v)); },
  cart(){ try{return JSON.parse(localStorage.getItem('sabina_cart')||'[]')}catch(e){return []} },
  saveCart(v){ localStorage.setItem('sabina_cart', JSON.stringify(v)); renderCartDrawer(); updateCartBadge(); },
};

function seedIfEmpty(){
  if(DB.items().length) return;
  const seed = [
    {name:'اسپرسو صابینا', ingredients:'اسپرسو دوبل، کف ملایم', category:'special', price:75000, image:''},
    {name:'آیس آمریکانو', ingredients:'اسپرسو، آب سرد، یخ', category:'cold', price:85000, image:''},
    {name:'کاپوچینو گرم', ingredients:'اسپرسو، شیر بخارداده', category:'hot', price:95000, image:''},
    {name:'ایس‌تی هلو', ingredients:'چای سرد، شربت هلو، یخ', category:'icetea', price:80000, image:''},
    {name:'چای ماسالا', ingredients:'چای دم‌کرده، دارچین، هل، زنجبیل', category:'tea', price:65000, image:''},
    {name:'ماکتیل توت‌فرنگی', ingredients:'پوره توت‌فرنگی، سودا، نعنا', category:'mocktail', price:110000, image:''},
    {name:'شیک شکلات', ingredients:'بستنی وانیل، شکلات، شیر', category:'shake', price:120000, image:''},
    {name:'چیزکیک زرشکی', ingredients:'پنیر خامه‌ای، سس زرشک', category:'dessert', price:135000, image:''},
  ].map(it=>({...it, id: uid()}));
  DB.saveItems(seed);
}
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============ Visit tracking (client-side counter) ============ */
function trackVisit(){
  let total = parseInt(localStorage.getItem('sabina_total_visits')||'0',10);
  let log = JSON.parse(localStorage.getItem('sabina_visit_log')||'[]');
  if(!sessionStorage.getItem('sabina_session_counted')){
    total += 1;
    log.push(Date.now());
    if(log.length>3000) log = log.slice(-3000);
    localStorage.setItem('sabina_total_visits', String(total));
    localStorage.setItem('sabina_visit_log', JSON.stringify(log));
    sessionStorage.setItem('sabina_session_counted','1');
  }
}
function getStats(){
  const total = parseInt(localStorage.getItem('sabina_total_visits')||'0',10);
  const log = JSON.parse(localStorage.getItem('sabina_visit_log')||'[]');
  const dayAgo = Date.now() - 24*60*60*1000;
  const last24 = log.filter(t=>t>dayAgo).length;
  return {total, last24};
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ============ Cart drawer ============ */
function updateCartBadge(){
  const c = DB.cart();
  const count = c.reduce((s,r)=>s+r.qty,0);
  document.getElementById('cartBadge').textContent = count;
}
function openCart(){ document.getElementById('overlay').classList.add('open'); document.getElementById('drawer').classList.add('open'); renderCartDrawer(); }
function closeCart(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
function renderCartDrawer(){
  const cart = DB.cart();
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  if(!cart.length){
    body.innerHTML = `<p class="empty-note">لیست شما خالی است.<br>از منو، آیتم موردنظر را به لیست اضافه کنید.</p>`;
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = cart.map(row=>`
    <div class="cart-row">
      <div class="info"><b>${esc(row.name)}</b><span class="qty">${row.qty} عدد · ${fmt(row.price*row.qty)} تومان</span></div>
      <button class="remove" data-action="cart-remove" data-id="${row.id}">✕</button>
    </div>
  `).join('');
  const total = cart.reduce((s,r)=>s+r.price*r.qty,0);
  foot.innerHTML = `
    <div class="total-row"><span>جمع تقریبی</span><span>${fmt(total)} تومان</span></div>
    <p class="cart-note">این لیست فقط برای نمایش به گارسون است؛ امکان ثبت سفارش آنلاین در این صفحه وجود ندارد.</p>
    <button class="btn-ghost" style="width:100%;text-align:center;margin-top:6px;" data-action="cart-clear">پاک‌کردن کل لیست</button>
  `;
}
function addToCart(itemId){
  const item = DB.items().find(i=>i.id===itemId);
  if(!item) return;
  const cart = DB.cart();
  const row = cart.find(r=>r.id===itemId);
  if(row) row.qty += 1;
  else cart.push({id:itemId, name:item.name, price:item.price, qty:1});
  DB.saveCart(cart);
  toast('به لیست سفارش اضافه شد ✓');
}
function removeFromCart(itemId){
  let cart = DB.cart();
  const row = cart.find(r=>r.id===itemId);
  if(row){
    row.qty -= 1;
    if(row.qty<=0) cart = cart.filter(r=>r.id!==itemId);
  }
  DB.saveCart(cart);
}
function clearCart(){ DB.saveCart([]); }

/* ============ Image upload handling ============ */
function fileToResizedDataURL(file, maxW=560){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ Router ============ */
function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);
  const app = document.getElementById('app');
  document.querySelectorAll('#navLinks a').forEach(a=>a.classList.remove('active'));

  if(parts.length===0){
    app.innerHTML = viewHome();
    setupVideoFallback();
    document.querySelector('#navLinks a[href="#/"]')?.classList.add('active');
  }else if(parts[0]==='menu' && !parts[1]){
    app.innerHTML = viewCategories();
    document.querySelector('#navLinks a[href="#/menu"]')?.classList.add('active');
  }else if(parts[0]==='menu' && parts[1]){
    app.innerHTML = viewCategoryItems(parts[1]);
  }else if(parts[0]==='admin' && !parts[1]){
    app.innerHTML = viewAdminEntry();
  }else if(parts[0]==='admin' && parts[1]==='dashboard'){
    app.innerHTML = viewAdminDashboard();
  }else if(parts[0]==='admin' && parts[1]==='add'){
    app.innerHTML = viewAdminAdd();
    bindItemForm();
  }else if(parts[0]==='admin' && parts[1]==='edit' && parts[2]){
    app.innerHTML = viewAdminAdd(parts[2]);
    bindItemForm();
  }else if(parts[0]==='admin' && parts[1]==='manage'){
    app.innerHTML = viewAdminManage();
  }else{
    app.innerHTML = viewHome();
  }
  window.scrollTo(0,0);
  updateCartBadge();
}

function setupVideoFallback(){
  const v = document.getElementById('cafeVideo');
  const fb = document.getElementById('videoFallback');
  if(!v) return;
  v.addEventListener('error', ()=>{ v.style.display='none'; fb.style.display='flex'; }, true);
  // if the source itself fails to load
  const src = v.querySelector('source');
  if(src){
    src.addEventListener('error', ()=>{ v.style.display='none'; fb.style.display='flex'; });
  }
}

function bindItemForm(){
  const form = document.getElementById('itemForm');
  if(!form) return;
  const box = document.getElementById('imgUploadBox');
  const fileInput = document.getElementById('f-image');
  const preview = document.getElementById('imgPreview');
  const hint = document.getElementById('imgHint');
  let currentImage = preview.getAttribute('src') || '';

  box.addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    currentImage = await fileToResizedDataURL(file);
    preview.src = currentImage;
    preview.style.display='block';
    hint.textContent = 'برای تغییر عکس کلیک کنید';
  });

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const id = document.getElementById('f-id').value;
    const name = document.getElementById('f-name').value.trim();
    const category = document.getElementById('f-cat').value;
    const ingredients = document.getElementById('f-ing').value.trim();
    const price = Number(document.getElementById('f-price').value)||0;
    if(!name){ toast('نام آیتم را وارد کنید'); return; }

    let items = DB.items();
    if(id){
      items = items.map(it=> it.id===id ? {...it, name, category, ingredients, price, image: currentImage||it.image} : it);
      toast('آیتم ویرایش شد ✓');
    }else{
      items.push({id: uid(), name, category, ingredients, price, image: currentImage});
      toast('آیتم به منو اضافه شد ✓');
    }
    DB.saveItems(items);
    location.hash = '#/admin/manage';
  });
}

/* ============ Global click delegation ============ */
document.body.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action==='open-cart') openCart();
  else if(action==='close-cart') closeCart();
  else if(action==='add-cart') addToCart(id);
  else if(action==='cart-remove') removeFromCart(id);
  else if(action==='cart-clear'){ if(confirm('کل لیست پاک شود؟')) clearCart(); }
  else if(action==='admin-login') adminLogin();
  else if(action==='admin-logout') adminLogout();
  else if(action==='edit-item') location.hash = '#/admin/edit/'+id;
  else if(action==='delete-item'){
    if(confirm('این آیتم حذف شود؟')){
      DB.saveItems(DB.items().filter(i=>i.id!==id));
      toast('آیتم حذف شد');
      route();
    }
  }
});

document.addEventListener('keydown', e=>{
