<style>
:root{
  --bg:#221f23; --bg-soft:#292630; --surface:#332f37; --surface-2:#3d3841;
  --line:#4b464e; --maroon:#7c2438; --maroon-light:#b03a52; --maroon-dark:#4f1523;
  --gold:#c9a15a;
  --cream:#f3ede7; --muted:#a99fa3; --shadow: 0 14px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--cream);font-family:'Vazirmatn',sans-serif;min-height:100vh;line-height:1.85;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
img{max-width:100%;display:block;}
::selection{background:var(--maroon);color:#fff;}
ul{margin:0;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
#app.fade-in{animation:fadeInUp .4s ease;}
@keyframes skeletonLoading{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);background-size:400% 100%;animation:skeletonLoading 1.3s ease infinite;border-radius:14px;}

.divider{width:100%;height:20px;background-image:radial-gradient(circle at 50% -6px, transparent 9px, var(--maroon) 10px, transparent 11px);background-size:26px 20px;background-repeat:repeat-x;opacity:.5;margin:10px 0;}

/* ---------- Top nav ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(34,31,35,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:11px 20px;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo-mark{width:42px;height:42px;flex:none;}
.brand .name-fa{font-weight:800;font-size:19px;letter-spacing:.5px;}
.brand .name-en{font-size:10px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:-3px;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-links a{font-size:14px;color:var(--muted);padding:8px 13px;border-radius:9px;transition:.2s;}
.nav-links a.active,.nav-links a:hover{color:var(--cream);background:var(--surface);}
.cart-btn{position:relative;display:flex;align-items:center;gap:7px;background:var(--maroon);color:#fff;padding:10px 16px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:.2s;}
.cart-btn:hover{background:var(--maroon-light);}
.cart-btn .badge{background:#fff;color:var(--maroon-dark);font-size:11px;font-weight:800;border-radius:99px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

#app{max-width:1120px;margin:0 auto;padding:0 20px 90px;min-height:50vh;}
.section{padding:40px 0 10px;}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:8px;}
h1,h2,h3{margin:0 0 8px;font-weight:800;}
.muted{color:var(--muted);}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;padding:66px 16px 10px;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:24px 24px;opacity:.18;mask-image:radial-gradient(ellipse at 50% 0%, black 0%, transparent 72%);pointer-events:none;}
.hero-inner{position:relative;z-index:1;}
.hero .logo-mark-big{width:104px;height:104px;margin:0 auto 20px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4));}
.hero h1{font-size:46px;margin-bottom:4px;background:linear-gradient(90deg,var(--cream),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero .en{letter-spacing:8px;color:var(--gold);font-size:13px;text-transform:uppercase;font-weight:700;margin-bottom:20px;}
.hero p{max-width:520px;margin:0 auto 22px;color:var(--muted);font-size:15px;}
.btn-primary{display:inline-block;background:var(--maroon);color:#fff;padding:14px 32px;border-radius:13px;font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:.2s;}
.btn-primary:hover{background:var(--maroon-light);transform:translateY(-2px);}
.btn-primary:disabled{opacity:.6;transform:none;cursor:default;}
.btn-ghost{display:inline-block;background:transparent;color:var(--cream);padding:12px 26px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;}
.btn-ghost:hover{border-color:var(--maroon-light);}

/* ---------- Event slider ---------- */
.event-slider{position:relative;max-width:620px;margin:0 auto 26px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);}
.event-slide{display:none;text-align:right;}
.event-slide.active{display:block;animation:fadeInUp .35s ease;}
.event-slide .ev-img-wrap{aspect-ratio:21/9;background:var(--surface-2);overflow:hidden;}
.event-slide .ev-img-wrap img{width:100%;height:100%;object-fit:cover;}
.event-slide .ev-img-wrap.placeholder{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold);background:linear-gradient(135deg,var(--surface-2),var(--bg-soft));}
.event-slide .ev-body{padding:14px 20px 16px;}
.event-slide .ev-body h4{margin:0 0 6px;font-size:15.5px;color:var(--gold);}
.event-slide .ev-body p{margin:0;font-size:12.5px;color:var(--muted);}
.event-nav{position:absolute;top:38%;width:30px;height:30px;border-radius:50%;background:rgba(34,31,35,.72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:2;}
.event-nav:hover{background:var(--maroon);}
.event-nav.prev{right:10px;}
.event-nav.next{left:10px;}
.event-dots{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2;}
.event-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:.2s;}
.event-dots span.active{background:var(--gold);width:16px;border-radius:4px;}

/* ---------- Featured strip ---------- */
.featured-strip{display:flex;gap:16px;overflow-x:auto;padding:30px 4px 14px;scroll-snap-type:x mandatory;}
.featured-strip::-webkit-scrollbar{height:6px;}
.featured-strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
.featured-card{flex:0 0 190px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:right;transition:.25s;}
.featured-card:hover{transform:translateY(-4px);border-color:var(--maroon-light);box-shadow:var(--shadow);}
.fc-img-wrap{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface-2);}
.fc-img-wrap img{width:100%;height:100%;object-fit:cover;transition:.45s;}
.featured-card:hover .fc-img-wrap img{transform:scale(1.08);}
.fc-img-wrap.placeholder{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--maroon-light);background:linear-gradient(135deg,var(--surface-2),var(--bg-soft));}
.fc-badge{position:absolute;top:8px;right:8px;background:var(--gold);color:#2a2117;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;}
.fc-body{padding:12px 13px 14px;}
.fc-body h4{font-size:13.5px;margin:0 0 8px;}
.fc-price{font-size:12px;font-weight:800;color:var(--gold);}

/* ---------- About / hours ---------- */
.about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:18px;}
@media (max-width:680px){.about-grid{grid-template-columns:1fr;}}
.about-text{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;font-size:14px;color:var(--muted);}
.about-text b{color:var(--cream);}
.about-hours{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;}
.about-hours h4{font-size:14.5px;margin:0 0 12px;color:var(--gold);}
.about-hours ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px;}
.about-hours li{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:9px;}
.about-hours li span:first-child{color:var(--cream);}
.about-hours li span:last-child{color:var(--muted);}

/* ---------- Category grid ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px;margin-top:20px;}
.cat-card{position:relative;background:linear-gradient(155deg,var(--surface),var(--bg-soft));border:1px solid var(--line);border-radius:18px;padding:24px 20px;transition:.25s;overflow:hidden;}
.cat-card:hover{border-color:var(--maroon-light);transform:translateY(-3px);box-shadow:var(--shadow);}
.cat-card .icon{font-size:30px;margin-bottom:12px;display:block;}
.cat-card h3{font-size:16px;margin-bottom:4px;}
.cat-card .count{font-size:12px;color:var(--muted);}
.cat-card::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--maroon),var(--gold));}
.cat-card .icon-bg{position:absolute;font-size:74px;opacity:.05;left:-6px;bottom:-16px;}

/* ---------- Category chips ---------- */
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 8px;}
.cat-chips::-webkit-scrollbar{height:5px;}
.cat-chips a{flex:none;padding:8px 15px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap;transition:.2s;}
.cat-chips a.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
.cat-chips a:hover{border-color:var(--maroon-light);color:var(--cream);}

/* ---------- Items ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:6px;}
.back-link:hover{color:var(--cream);}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin-top:8px;}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.25s;}
.item-card:hover{border-color:var(--maroon-light);transform:translateY(-3px);box-shadow:var(--shadow);}
.item-img-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2);}
.item-img-wrap img{width:100%;height:100%;object-fit:cover;transition:.45s;}
.item-card:hover .item-img-wrap img{transform:scale(1.07);}
.item-img-wrap.placeholder{display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--maroon-light);background:linear-gradient(135deg,var(--surface-2),var(--bg-soft));}
.price-badge{position:absolute;bottom:10px;left:10px;background:rgba(34,31,35,.88);backdrop-filter:blur(4px);color:#fff;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:10px;}
.price-badge::after{content:" تومان";font-weight:400;font-size:10px;color:var(--muted);}
.item-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:8px;flex:1;}
.item-body h4{font-size:16px;margin:0;}
.item-body .ing{font-size:12.5px;color:var(--muted);min-height:34px;}
.item-foot{margin-top:auto;padding-top:6px;display:flex;justify-content:flex-end;}
.add-btn{background:var(--maroon);color:#fff;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700;transition:.2s;}
.add-btn:hover{background:var(--maroon-light);}
.stepper{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 6px;}
.stepper button{width:25px;height:25px;border-radius:7px;background:var(--surface-2);color:var(--cream);font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.stepper button:hover{background:var(--maroon);color:#fff;}
.stepper span{min-width:16px;text-align:center;font-weight:700;font-size:13.5px;}
.empty-note{color:var(--muted);text-align:center;padding:44px 10px;font-size:14px;}
.loading-note{color:var(--muted);text-align:center;padding:60px 10px;font-size:14px;}
.error-banner{background:#3a2027;border:1px solid var(--maroon);color:#f1c4cd;padding:16px 18px;border-radius:14px;font-size:13.5px;margin:16px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.retry-btn{background:var(--maroon);color:#fff;border-radius:9px;padding:8px 18px;font-size:12.5px;font-weight:700;}
.retry-btn:hover{background:var(--maroon-light);}

/* ---------- Cart drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:.25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(370px,88vw);background:var(--bg-soft);z-index:61;border-left:1px solid var(--line);transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h3{margin:0;font-size:16px;}
.drawer-close{background:var(--surface);width:32px;height:32px;border-radius:9px;color:var(--muted);font-size:16px;}
.drawer-body{flex:1;overflow:auto;padding:14px 18px;}
.drawer-foot{padding:16px 18px;border-top:1px solid var(--line);}
.cart-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px dashed var(--line);}
.cart-row .info{font-size:13.5px;}
.cart-row .info b{display:block;font-size:14px;}
.cart-row .qty{color:var(--muted);font-size:12px;}
.cart-row .remove{background:transparent;color:var(--maroon-light);font-size:18px;padding:4px 8px;}
.cart-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.9;}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:10px;}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);margin-top:60px;padding:30px 18px 26px;text-align:center;color:var(--muted);font-size:12.5px;}
.footer-social{display:flex;justify-content:center;gap:12px;margin-bottom:14px;}
.footer-social a{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);transition:.2s;}
.footer-social a:hover{color:#fff;background:var(--maroon);border-color:var(--maroon);}

/* ---------- Admin ---------- */
.admin-shell{max-width:1000px;}
.login-box{max-width:360px;margin:70px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px 26px;text-align:center;box-shadow:var(--shadow);}
.login-box .logo-mark{width:56px;height:56px;margin:0 auto 14px;}
.field{margin-bottom:14px;text-align:right;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--cream);padding:11px 13px;font-family:inherit;font-size:14px;outline:none;transition:.2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--maroon-light);}
.field textarea{resize:vertical;min-height:70px;}
.field.checkbox{display:flex;align-items:center;gap:8px;flex-direction:row-reverse;justify-content:flex-end;}
.field.checkbox input{width:auto;}
.error-msg{color:#e07a8d;font-size:13px;margin-top:8px;min-height:16px;}
.ok-msg{color:#7fc797;font-size:13px;margin-top:8px;min-height:16px;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;}
.stat-card .num{font-size:34px;font-weight:800;color:var(--gold);}
.stat-card .lbl{color:var(--muted);font-size:13px;margin-top:4px;}

.admin-tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;align-items:center;}
.admin-tabs a{padding:9px 16px;border-radius:10px;font-size:13.5px;border:1px solid var(--line);color:var(--muted);}
.admin-tabs a.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}

.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

.img-upload{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer;background:var(--bg);}
.img-upload img{max-height:130px;margin:0 auto 8px;border-radius:10px;}
.img-upload .hint{font-size:12px;color:var(--muted);}

.manage-cat{margin-top:26px;}
.manage-cat h3{font-size:15px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}
.manage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;}
.manage-item{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;gap:10px;align-items:center;transition:.15s;}
.manage-item:hover{border-color:var(--maroon-light);}
.manage-item .thumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:var(--surface-2);flex:none;}
.manage-item .thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--maroon-light);}
.manage-item .mi-info{flex:1;min-width:0;}
.manage-item .mi-info b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.manage-item .mi-info span{font-size:11.5px;color:var(--muted);}
.mi-actions{display:flex;flex-direction:column;gap:6px;}
.mi-actions button{background:var(--surface-2);color:var(--cream);border-radius:8px;padding:5px 10px;font-size:11.5px;}
.mi-actions button.del{color:#e07a8d;}
.mi-actions button:hover{background:var(--maroon);color:#fff;}
.status-pill{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);}
.status-pill.on{background:#274a33;color:#8fd8a7;}
.status-pill.off{background:#4a2730;color:#e0a3ae;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--maroon);color:#fff;padding:12px 22px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.small-link{font-size:12px;color:var(--muted);}
.small-link:hover{color:var(--maroon-light);}
.logout-btn{background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 14px;font-size:12.5px;}
.logout-btn:hover{color:var(--cream);}
</style>
</head>
<body>

/* ==========================================================
   لایه‌ی شبکه: هر درخواست حداکثر ۷ ثانیه صبر می‌کند و در صورت
   خطا، ۱ بار دیگر تلاش می‌کند. این باعث می‌شود در اتصال‌های کند
   یا ناپایدار، سایت به‌جای هنگ‌کردن طولانی، سریع خطا/نتیجه بدهد.
   ========================================================== */
function withTimeout(promise, ms){
  return new Promise((resolve,reject)=>{
    const t = setTimeout(()=>reject(new Error('timeout')), ms);
    promise.then(v=>{clearTimeout(t); resolve(v);}, e=>{clearTimeout(t); reject(e);});
  });
}
async function sbCall(factory, {retries=1, timeoutMs=7000}={}){
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await withTimeout(factory(), timeoutMs); }
    catch(e){ lastErr = e; if(i<retries) await new Promise(r=>setTimeout(r, 400)); }
  }
  return {data:null, error:{message: (lastErr&&lastErr.message)||'ارتباط برقرار نشد'}};
}

/* ============ Data cache (with session storage for instant repeat loads) ============ */
let CATS = [], ITEMS = [], EVENTS = [];
let DATA_LOADED = false;
const CACHE_KEY = 'sabina_cache_v1';
const CACHE_TTL = 10*60*1000; // ۱۰ دقیقه

function hydrateFromCache(){
  try{
    const raw = sessionStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const c = JSON.parse(raw);
    if(!c || (Date.now()-c.ts) > CACHE_TTL) return false;
    CATS = c.cats||[]; ITEMS = c.items||[]; EVENTS = c.events||[];
    DATA_LOADED = true;
    return true;
  }catch(e){ return false; }
}
function saveCache(){
  try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify({cats:CATS, items:ITEMS, events:EVENTS, ts:Date.now()})); }catch(e){}
}

async function loadData(force){
  if(DATA_LOADED && !force) return {ok:true};
  const [catsRes, itemsRes, eventsRes] = await Promise.all([
    sbCall(()=>sb.from('categories').select('*').order('sort_order')),
    sbCall(()=>sb.from('items').select('*').order('created_at', {ascending:false})),
    sbCall(()=>sb.from('events').select('*').order('created_at', {ascending:false}))
  ]);
  if(catsRes.error || itemsRes.error){
    return {ok:false, error: (catsRes.error||itemsRes.error).message};
  }
  CATS = catsRes.data || [];
  ITEMS = itemsRes.data || [];
  EVENTS = eventsRes.error ? [] : (eventsRes.data || []); // اگر جدول رویدادها هنوز ساخته نشده، نادیده بگیر
  DATA_LOADED = true;
  saveCache();
  return {ok:true};
}
const catName = slug => (CATS.find(c=>c.slug===slug)||{}).name || slug;
const catIcon = slug => (CATS.find(c=>c.slug===slug)||{}).icon || '☕';
const catCount = slug => ITEMS.filter(i=>i.category_slug===slug).length;

/* ============ Cart (client-side only — a list to show the waiter) ============ */
const CartDB = {
  get(){ try{return JSON.parse(localStorage.getItem('sabina_cart')||'[]')}catch(e){return []} },
  save(v){ localStorage.setItem('sabina_cart', JSON.stringify(v)); renderCartDrawer(); updateCartBadge(); refreshQtyZones(); }
};

/* ============ Helpers ============ */
function esc(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n){ return Number(n||0).toLocaleString('fa-IR'); }

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* ============ Cart drawer ============ */
function updateCartBadge(){
  const c = CartDB.get();

function closeCart(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
function renderCartDrawer(){
  const cart = CartDB.get();
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  if(!cart.length){
    body.innerHTML = `<p class="empty-note">لیست شما خالی است.<br>از منو، آیتم موردنظر را به لیست اضافه کنید.</p>`;
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = cart.map(row=>`
    <div class="cart-row">
      <div class="info"><b>${esc(row.name)}</b><span class="qty">${row.qty} عدد · ${fmt(row.price*row.qty)} تومان</span></div>
      <button class="remove" data-action="cart-remove" data-id="${row.id}">✕</button>
    </div>`).join('');
  const total = cart.reduce((s,r)=>s+r.price*r.qty,0);
  foot.innerHTML = `
    <div class="total-row"><span>جمع تقریبی</span><span>${fmt(total)} تومان</span></div>
    <p class="cart-note">این لیست فقط برای نمایش به گارسون است؛ امکان ثبت سفارش آنلاین در این صفحه وجود ندارد.</p>
    <button class="btn-ghost" style="width:100%;text-align:center;margin-top:6px;" data-action="cart-clear">پاک‌کردن کل لیست</button>`;
}
function addToCart(itemId, name, price){
  const cart = CartDB.get();
  const row = cart.find(r=>String(r.id)===String(itemId));
  if(row) row.qty += 1;
  else cart.push({id:itemId, name, price:Number(price)||0, qty:1});
  CartDB.save(cart);
  toast('به لیست سفارش اضافه شد ✓');
}
function removeFromCart(itemId){
  let cart = CartDB.get();
  const row = cart.find(r=>String(r.id)===String(itemId));
  if(row){ row.qty -= 1; if(row.qty<=0) cart = cart.filter(r=>String(r.id)!==String(itemId)); }
  CartDB.save(cart);
}
function clearCart(){ CartDB.save([]); }

function qtyControlHTML(item){
  const cart = CartDB.get();
  const row = cart.find(r=>String(r.id)===String(item.id));
  const qty = row ? row.qty : 0;
  if(qty>0){
    return `<div class="stepper">
      <button data-action="cart-remove" data-id="${item.id}">−</button>
      <span>${qty}</span>
      <button data-action="add-cart" data-id="${item.id}" data-name="${esc(item.name)}" data-price="${item.price}">+</button>
    </div>`;
  }
  return `<button class="add-btn" data-action="add-cart" data-id="${item.id}" data-name="${esc(item.name)}" data-price="${item.price}">افزودن به لیست</button>`;
}
function refreshQtyZones(){
  document.querySelectorAll('[data-qty-for]').forEach(zone=>{
    zone.innerHTML = qtyControlHTML({id: zone.dataset.qtyFor, name: zone.dataset.name, price: zone.dataset.price});

/* ============ Visit tracking (non-blocking, silent on failure) ============ */
function trackVisit(){
  if(sessionStorage.getItem('sabina_session_counted')) return;
  sbCall(()=>sb.from('visits').insert({session_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()))}), {retries:0, timeoutMs:6000})
    .then(()=>{ sessionStorage.setItem('sabina_session_counted','1'); })
    .catch(()=>{});
}
async function getStats(){
  const dayAgo = new Date(Date.now() - 24*60*60*1000).toISOString();
  const [totalRes, last24Res] = await Promise.all([
    sbCall(()=>sb.from('visits').select('*', {count:'exact', head:true})),
    sbCall(()=>sb.from('visits').select('*', {count:'exact', head:true}).gte('visited_at', dayAgo))
  ]);
  return {total: totalRes.count||0, last24: last24Res.count||0, error: totalRes.error||last24Res.error};
}

/* ============ Event slider ============ */
let eventSliderTimer = null;
let eventSliderIndex = 0;
function renderEventSlider(events){
  const active = (events||[]).filter(e=>e.active !== false);
  if(!active.length) return '';
  return `
  <div class="event-slider" id="eventSlider">
    ${active.map((ev,i)=>`
      <div class="event-slide ${i===0?'active':''}" data-idx="${i}">
        <div class="ev-img-wrap ${ev.image_url?'':'placeholder'}">
          ${ev.image_url?`<img src="${esc(ev.image_url)}" alt="${esc(ev.title)}">`:'🎉'}
        </div>
        <div class="ev-body">
          <h4>${esc(ev.title)}</h4>
          ${ev.description?`<p>${esc(ev.description)}</p>`:''}
        </div>
      </div>`).join('')}
    ${active.length>1?`
      <button class="event-nav prev" data-action="event-prev">›</button>
      <button class="event-nav next" data-action="event-next">‹</button>
      <div class="event-dots">${active.map((_,i)=>`<span class="${i===0?'active':''}" data-action="event-dot" data-idx="${i}"></span>`).join('')}</div>
    `:''}
  </div>`;
}
function showEventSlide(idx){
  const wrap = document.getElementById('eventSlider');
  if(!wrap) return;
  const slides = wrap.querySelectorAll('.event-slide');
  const dots = wrap.querySelectorAll('.event-dots span');
  if(!slides.length) return;
  eventSliderIndex = (idx + slides.length) % slides.length;
  slides.forEach((s,i)=>s.classList.toggle('active', i===eventSliderIndex));
  dots.forEach((d,i)=>d.classList.toggle('active', i===eventSliderIndex));
}
function startEventAutoplay(){
  stopEventAutoplay();
  const wrap = document.getElementById('eventSlider');
  if(!wrap || wrap.querySelectorAll('.event-slide').length<2) return;
  eventSliderTimer = setInterval(()=>showEventSlide(eventSliderIndex+1), 4500);
}
function stopEventAutoplay(){ if(eventSliderTimer){ clearInterval(eventSliderTimer); eventSliderTimer=null; } }

/* ============ Image resize + upload to Supabase Storage ============ */
function fileToResizedBlob(file, maxW=700){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>resolve(blob), 'image/jpeg', 0.85);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadImage(blob, folder){
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error} = await sbCall(()=>sb.storage.from('menu-images').upload(path, blob, {contentType:'image/jpeg', upsert:false}), {retries:0, timeoutMs:15000});
  if(error) return null;
  const {data} = sb.storage.from('menu-images').getPublicUrl(path);
  return data ? data.publicUrl : null;
}

function bindImageBox(boxId, fileId, previewId, hintId, onSelect){
  const box = document.getElementById(boxId);
  const fileInput = document.getElementById(fileId);
  const preview = document.getElementById(previewId);
  const hint = document.getElementById(hintId);
  if(!box) return;
  box.addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    onSelect(file);
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    hint.textContent = 'برای تغییر عکس کلیک کنید';
  });
}

function bindItemForm(){
  const form = document.getElementById('itemForm');
  if(!form) return;
  const preview = document.getElementById('imgPreview');
  const existingImage = preview.getAttribute('src') || '';
  let selectedFile = null;
  bindImageBox('imgUploadBox','f-image','imgPreview','imgHint', file=>{selectedFile=file;});

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const errEl = document.getElementById('itemFormError');
    errEl.textContent = '';
    const id = document.getElementById('f-id').value;
    const name = document.getElementById('f-name').value.trim();
    if(!name){ errEl.textContent = 'نام آیتم را وارد کنید'; return; }
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; const oldTxt = btn.textContent; btn.textContent = 'در حال ذخیره...';

    let imageUrl = existingImage;
    if(selectedFile){
      const blob = await fileToResizedBlob(selectedFile);
      const uploaded = await uploadImage(blob, 'items');
      if(uploaded) imageUrl = uploaded;
    }

    const payload = {
      name,
      category_slug: document.getElementById('f-cat').value,
      ingredients: document.getElementById('f-ing').value.trim(),
      price: Number(document.getElementById('f-price').value) || 0,
      image_url: imageUrl || null
    };

    let error;
    if(id){
      ({error} = await sbCall(()=>sb.from('items').update(payload).eq('id', id), {retries:0, timeoutMs:10000}));
    } else {
      ({error} = await sbCall(()=>sb.from('items').insert(payload), {retries:0, timeoutMs:10000}));
    }

    btn.disabled = false; btn.textContent = oldTxt;
    if(!error){ toast('ذخیره شد ✓'); location.hash = '#/admin/manage'; }
    else{ errEl.textContent = 'خطا در ذخیره‌سازی: ' + error.message; }
  });
}

    else{ msg.textContent = 'خطا در تغییر رمز: ' + error.message; }

/* ============ Router ============ */
async function route(){
  stopEventAutoplay();
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);
  const app = document.getElementById('app');
  document.querySelectorAll('#navLinks a').forEach(a=>a.classList.remove('active'));
  app.classList.remove('fade-in');

  if(!DATA_LOADED) hydrateFromCache();
  if(!DATA_LOADED) app.innerHTML = `<p class="loading-note">در حال بارگذاری...</p>`;

  try{
    if(parts.length===0){
      app.innerHTML = await viewHome();
      document.querySelector('#navLinks a[href="#/"]')?.classList.add('active');
      startEventAutoplay();
    }else if(parts[0]==='menu' && !parts[1]){
      app.innerHTML = await viewCategories();
      document.querySelector('#navLinks a[href="#/menu"]')?.classList.add('active');
    }else if(parts[0]==='menu' && parts[1]){
      app.innerHTML = await viewCategoryItems(parts[1]);
    }else if(parts[0]==='admin' && !parts[1]){
      if(await checkAdmin()){ location.hash = '#/admin/dashboard'; return; }
      app.innerHTML = viewAdminEntry();
    }else if(parts[0]==='admin' && parts[1]==='dashboard'){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = await viewAdminDashboard();
    }else if(parts[0]==='admin' && parts[1]==='add'){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = await viewAdminAdd();
      bindItemForm();
    }else if(parts[0]==='admin' && parts[1]==='edit' && parts[2]){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = await viewAdminAdd(parts[2]);
      bindItemForm();
    }else if(parts[0]==='admin' && parts[1]==='manage'){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = await viewAdminManage();
    }else if(parts[0]==='admin' && parts[1]==='events' && parts[2]==='edit' && parts[3]){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = await viewAdminEvents(parts[3]);
      bindEventForm();
    }else if(parts[0]==='admin' && parts[1]==='events'){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = await viewAdminEvents();
      bindEventForm();
    }else if(parts[0]==='admin' && parts[1]==='settings'){
      if(!(await checkAdmin())){ location.hash = '#/admin'; return; }
      app.innerHTML = viewAdminSettings();
      bindPassForm();
    }else{
      app.innerHTML = await viewHome();
      startEventAutoplay();
    }
  }catch(err){
    app.innerHTML = retryBannerHTML('خطای غیرمنتظره رخ داد.');
  }

  void app.offsetWidth;
  app.classList.add('fade-in');
  window.scrollTo(0,0);
  updateCartBadge();
}

/* ============ Global click delegation ============ */
document.body.addEventListener('click', async e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action, id = t.dataset.id;
  if(action==='open-cart') openCart();
  else if(action==='close-cart') closeCart();
  else if(action==='add-cart') addToCart(id, t.dataset.name, t.dataset.price);
  else if(action==='cart-remove') removeFromCart(id);
  else if(action==='cart-clear'){ if(confirm('کل لیست پاک شود؟')) clearCart(); }
  else if(action==='admin-login') adminLogin();
  else if(action==='admin-logout') adminLogout();
  else if(action==='edit-item') location.hash = '#/admin/edit/'+id;
  else if(action==='retry-route'){ DATA_LOADED=false; route(); }
  else if(action==='event-prev'){ stopEventAutoplay(); showEventSlide(eventSliderIndex-1); startEventAutoplay(); }
  else if(action==='event-next'){ stopEventAutoplay(); showEventSlide(eventSliderIndex+1); startEventAutoplay(); }
  else if(action==='event-dot'){ stopEventAutoplay(); showEventSlide(Number(t.dataset.idx)); startEventAutoplay(); }
  else if(action==='edit-event') location.hash = '#/admin/events/edit/'+id;
  else if(action==='toggle-event'){
    const current = t.dataset.active === 'true';
    const {error} = await sbCall(()=>sb.from('events').update({active: !current}).eq('id', id), {retries:0, timeoutMs:8000});
    if(!error){ toast(!current?'رویداد فعال شد':'رویداد غیرفعال شد'); route(); }
    else{ toast('خطا: ' + error.message); }
  }
  else if(action==='delete-event'){
    if(confirm('این رویداد حذف شود؟')){
      const {error} = await sbCall(()=>sb.from('events').delete().eq('id', id), {retries:0, timeoutMs:8000});
      if(!error){ toast('رویداد حذف شد'); route(); }
      else{ toast('خطا در حذف: ' + error.message); }
    }
  }
  else if(action==='delete-item'){
    if(confirm('این آیتم حذف شود؟')){
      const {error} = await sbCall(()=>sb.from('items').delete().eq('id', id), {retries:0, timeoutMs:8000});
      if(!error){ toast('آیتم حذف شد'); route(); }
      else{ toast('خطا در حذف: ' + error.message); }
    }
  }
});
